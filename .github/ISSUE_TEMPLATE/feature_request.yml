name: Feature request
description: Propose a focused improvement to MyRide
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What rider need or workflow problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the desired behavior without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: offline
    attributes:
      label: Offline and privacy considerations
      description: Explain any network, permission, location, photo, or sensitive-data impact.
